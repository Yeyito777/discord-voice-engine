[package]
name = "discord-voice-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared native audio-to-Opus RTP engine for Discord voice clients"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
opus = "0.3.1"
nnnoiseless = { version = "0.5.2", default-features = false }
rubato = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
symphonia = { version = "0.5", features = ["all"] }

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
